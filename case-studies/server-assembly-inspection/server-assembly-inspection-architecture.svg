<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title description">
  <title id="title">Server Assembly Inspection: four-agent architecture</title>
  <desc id="description">Conceptual in-progress architecture. Cloud Planner orchestrates KM retrieval, edge camera and lighting control, and VLM analysis. Optical diagnosis and physical-limit feedback return to Planner. Implementation and validation are pending.</desc>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#376b92"/></marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ad652b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#18334a} .title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#536c7c}.boundary{font-size:20px;font-weight:700}.meta{font-size:14px;fill:#597381}.name{font-size:21px;font-weight:700}.body{font-size:16px;fill:#375566}.label{font-size:14px;fill:#315d7a}.feedback{font-size:14px;fill:#945021}.foot{font-size:15px;fill:#526979}.normal{fill:none;stroke:#376b92;stroke-width:2.5;marker-end:url(#blueArrow)}.return{fill:none;stroke:#ad652b;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#amberArrow)}
    </style>
  </defs>
  <rect width="1200" height="850" fill="#f8fafb"/>
  <text x="40" y="55" class="title">Server Assembly Inspection</text>
  <text x="40" y="88" class="subtitle">Four-agent orchestration · event-driven cloud–edge design</text>
  <rect x="981" y="31" width="179" height="34" rx="17" fill="#fff0dc"/>
  <text x="1070.5" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="#92521d">DESIGN IN PROGRESS</text>
  <line x1="40" y1="111" x2="1160" y2="111" stroke="#d8e2e8"/>

  <rect x="40" y="138" width="745" height="540" rx="18" fill="#edf4f8" stroke="#c7dbe7" stroke-width="1.5"/>
  <text x="64" y="173" class="boundary">CYBER · Cloud reasoning</text>
  <text x="64" y="196" class="meta">Semantic planning, knowledge retrieval, image interpretation</text>
  <rect x="820" y="138" width="340" height="540" rx="18" fill="#eef5ef" stroke="#c9dfcd" stroke-width="1.5"/>
  <text x="844" y="173" class="boundary">PHYSICAL · Edge control</text>
  <text x="844" y="196" class="meta">Local equipment execution and limits</text>

  <rect x="260" y="225" width="300" height="135" rx="12" fill="#183f5c"/>
  <text x="282" y="260" class="name" style="fill:#ffffff">Planner Agent</text>
  <text x="282" y="288" class="body" style="fill:#e6eff5">Orchestrate agent handoffs</text>
  <text x="282" y="312" class="body" style="fill:#e6eff5">Create / revise acquisition plan</text>
  <text x="282" y="337" font-size="14" style="fill:#bfd4e2">Coordination and adaptive planning</text>

  <rect x="75" y="460" width="285" height="145" rx="12" fill="#ffffff" stroke="#c1d4df" stroke-width="1.5"/>
  <text x="96" y="496" class="name">KM Agent</text>
  <text x="96" y="525" class="body">RAG knowledge retrieval</text>
  <text x="96" y="551" class="body">BOM requirements · CAD geometry</text>
  <text x="96" y="577" class="body">Optical / lighting experience</text>

  <rect x="445" y="460" width="285" height="145" rx="12" fill="#ffffff" stroke="#c1d4df" stroke-width="1.5"/>
  <text x="466" y="496" class="name">VLM Agent</text>
  <text x="466" y="525" class="body">Analyze acquired images</text>
  <text x="466" y="551" class="body">Correct assembly → PASS</text>
  <text x="466" y="577" class="body">Poor visibility → optical diagnosis</text>

  <rect x="845" y="340" width="290" height="155" rx="12" fill="#ffffff" stroke="#bdd7c3" stroke-width="1.5"/>
  <text x="866" y="375" class="name">Physical Agent</text>
  <text x="866" y="405" class="body">Control camera and lighting</text>
  <text x="866" y="432" class="body">Report physical limits</text>
  <text x="866" y="459" class="body">Intended local collision safeguards</text>
  <text x="866" y="481" class="meta">Implementation / validation pending</text>

  <rect x="845" y="553" width="290" height="91" rx="12" fill="#dfece1" stroke="#bdd7c3"/>
  <text x="990" y="587" text-anchor="middle" font-size="19" font-weight="700">Camera + Lighting</text>
  <text x="990" y="614" text-anchor="middle" class="body">Acquire the inspection scene</text>

  <path d="M 320 360 L 320 390 L 218 390 L 218 460" class="normal" marker-start="url(#blueArrow)"/>
  <text x="78" y="420" class="label">Knowledge request</text>
  <text x="78" y="440" class="label">and retrieved context</text>
  <path d="M 560 285 L 990 285 L 990 340" class="normal"/>
  <text x="638" y="270" class="label">Acquisition plan</text>
  <path d="M 990 495 L 990 553" class="normal"/>
  <text x="1008" y="529" class="label">Local control</text>
  <path d="M 845 450 L 765 450 L 765 510 L 730 510" class="normal"/>
  <text x="749" y="546" class="label">Image</text>
  <path d="M 575 460 L 575 400 L 520 400 L 520 360" class="return"/>
  <text x="589" y="418" class="feedback">Reflection / shadow</text>
  <text x="589" y="439" class="feedback">diagnosis → replan</text>
  <path d="M 845 352 L 801 352 L 801 330 L 560 330" class="return"/>
  <text x="618" y="356" class="feedback">Physical-limit feedback</text>

  <text x="64" y="648" class="meta">Asynchronous interactions · workflow continuity still requires a state design</text>

  <line x1="43" y1="711" x2="83" y2="711" stroke="#376b92" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <text x="96" y="716" class="foot">Planned task / data handoff</text>
  <line x1="378" y1="711" x2="418" y2="711" stroke="#ad652b" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#amberArrow)"/>
  <text x="431" y="716" class="foot">Feedback to revise the plan</text>

  <rect x="40" y="744" width="1120" height="70" rx="10" fill="#ffffff" stroke="#d6e0e6"/>
  <text x="59" y="769" font-size="15" font-weight="700">Proposed validation topics — not confirmed implemented features</text>
  <text x="59" y="795" class="foot">State persistence · retry limits · idempotent actions · human escalation · inspection quality · edge protection behavior</text>
  <text x="1160" y="837" text-anchor="end" font-size="12" fill="#70838f">Conceptual design · generic data · no production or safety-certification claim</text>
</svg>
